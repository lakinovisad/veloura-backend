name: ci.yml

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]

    steps:
      - name: 🧾 Checkout sa punom istorijom
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🛠️ Postavi Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: 🔧 Konfiguriši Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: 📦 Instaliraj dependencije
        run: npm ci

      - name: 🛠️ Kreiraj logs/ folder
        run: mkdir -p logs

      - name: 🧠 Git info (sigurno)
        run: |
          git status || true
          git log -1 || true
          git rev-parse HEAD || true
          git config --get remote.origin.url || true
          ls -la .git || true

      - name: 🧪 Pokreni testove sa coverage
        run: npm test -- --coverage --detectOpenHandles --forceExit || true

      - name: 🔍 Proveri coverage folder
        id: check_coverage
        run: |
          if [ -d "coverage" ]; then
            echo "coverage_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Coverage folder postoji"
            ls -la coverage/
          else
            echo "coverage_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Coverage folder ne postoji"
          fi

      - name: 📈 Upload coverage rezultata
        if: steps.check_coverage.outputs.coverage_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: ignore 