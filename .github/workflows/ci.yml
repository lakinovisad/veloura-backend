name: ci.yml

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: 🧾 Checkout sa punom istorijom
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🛠️ Postavi Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📦 Instaliraj dependencije
        run: npm ci

      - name: 🛠️ Kreiraj logs/ folder
        run: mkdir -p logs

      - name: 🧠 Git info (sigurno)
        run: |
          git status || true
          git log -1 || true
          git rev-parse HEAD || true
          git config --get remote.origin.url || true
          ls -la .git || true

      - name: 🧪 Pokreni testove sa coverage
        run: npm test -- --coverage
        continue-on-error: true

      - name: 📈 Upload coverage rezultata
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/ 