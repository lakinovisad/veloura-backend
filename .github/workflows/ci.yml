name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        # Updated to v4 for improved security and speed

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
        # Updated to v4 for compatibility with latest Node versions

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Debug Git info pre testova
        run: |
          git status
          git log -1
          git config --get remote.origin.url
          ls -la .git

      - name: 🧪 Run tests with coverage
        run: npm test -- --coverage

      - name: 📤 Upload coverage report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
        # Updated to v4 to avoid deprecation issues 