name: ✅ CI - Veloura Backend Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 🔄 Checkout kod
      uses: actions/checkout@v3

    - name: 🟢 Instaliraj Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: 📦 Instaliraj dependencije
      run: npm install

    - name: 🧪 Pokreni testove
      run: npm test 