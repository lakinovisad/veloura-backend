name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        # Updated to v4 for improved security and speed

      - name: 🔧 Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
        # Updated to v4 for compatibility with latest Node versions

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Ensure logs/ folder exists
        run: mkdir -p logs

      - name: 🧪 Debug Git info pre testova
        run: |
          git status
          git log -1
          git config --get remote.origin.url
          ls -la .git

      - name: 🧪 Pokreni testove sa coverage
        run: npm test -- --coverage --runInBand --maxWorkers=50%

      - name: 🔍 Check coverage files
        run: |
          echo "📊 Checking for coverage files..."
          ls -la coverage/ || echo "⚠️ No coverage directory found"
          find . -name "*.html" -o -name "*.json" | grep -i coverage || echo "⚠️ No coverage files found"

      - name: 📤 Upload coverage report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
        # Updated to v4 to avoid deprecation issues 