name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        # Updated to v4 for improved security and speed

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        # Updated to v4 for compatibility with latest Node versions

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

      - name: 📤 Upload test artifacts (if any)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage
        # Updated to v4 to avoid deprecation issues 